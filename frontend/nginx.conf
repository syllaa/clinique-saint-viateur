# nginx for the public site (frontend image). TLS is expected to be handled
# in front of this container (host nginx, Caddy, Traefik, cloud LB…).

# Security headers, reused in every location that sets its own headers
# (nginx does not inherit add_header into a location that defines any).
map $host $csp {
  default "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self'; connect-src 'self'; frame-src https://www.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'";
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Uploads go through to the API (images, CVs, videos — see MAX_*_MB).
  client_max_body_size 20m;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

  # ── API (same origin: no CORS needed) ──
  location ~ ^/(api|auth|uploads)/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }
  location = /sitemap.xml { proxy_pass http://api:8000; proxy_set_header Host $host; }
  location = /robots.txt  { proxy_pass http://api:8000; proxy_set_header Host $host; }

  # ── Fingerprinted build files: cache for a year ──
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri =404;
  }

  # ── SPA: every other path serves index.html (never cached) ──
  location / {
    add_header Cache-Control "no-cache";
    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # Enable once the site is served over HTTPS only:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    try_files $uri $uri/ /index.html;
  }
}
