<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clinique Médicale Saint Viateur – Riviera Sideci, Cocody, Abidjan</title>
    <meta
      name="description"
      content="Clinique Médicale Saint Viateur – Établissement privé de santé à Cocody, Abidjan. Soins 24h/24, urgences, gynécologie, chirurgie, pédiatrie et plus."
    />
    <meta name="theme-color" content="#7a0f1a" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=DM+Sans:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      #preloader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background: #1d0a0c;
        transition:
          opacity 0.35s ease,
          visibility 0.35s ease;
      }
      #preloader.pl-hide {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .pl-emblem {
        width: 54px;
        height: 54px;
      }
      .pl-spinner {
        width: 30px;
        height: 30px;
        border: 3px solid rgba(255, 255, 255, 0.15);
        border-top-color: #f3aab4;
        border-radius: 50%;
        animation: pl-spin 0.8s linear infinite;
      }
      @keyframes pl-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="preloader">
      <svg class="pl-emblem" viewBox="0 0 64 64" aria-hidden="true">
        <defs>
          <linearGradient id="pl-g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#c8102e" />
            <stop offset="1" stop-color="#e0475a" />
          </linearGradient>
        </defs>
        <circle cx="32" cy="32" r="32" fill="url(#pl-g)" />
        <path d="M27 16h10v11h11v10H37v11H27V37H16V27h11z" fill="#fff" stroke="#fff" stroke-width="2" stroke-linejoin="round" />
      </svg>
      <div class="pl-spinner"></div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
