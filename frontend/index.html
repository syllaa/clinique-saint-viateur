<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

         don't run JavaScript: they only ever read these static tags.
         %VITE_SITE_URL% is replaced at build time (frontend/.env). -->

      content="Établissement médical privé à Cocody, Abidjan. Urgences et réanimation 24h/24, 7j/7. Appelez le 27 22 59 04 17."
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=DM+Sans:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      #preloader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background: #1d0a0c;
        transition:
          opacity 0.35s ease,
          visibility 0.35s ease;
      }
      #preloader.pl-hide {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .pl-emblem {
        width: 54px;
        height: 54px;
      }
      .pl-spinner {
        width: 30px;
        height: 30px;
        border: 3px solid rgba(255, 255, 255, 0.15);
        border-top-color: #f3aab4;
        border-radius: 50%;
        animation: pl-spin 0.8s linear infinite;
      }
      @keyframes pl-spin {
        to {
          transform: rotate(360deg);
        }
      }
      .pl-name {
        display: none;
        color: #fff;
        font-family: "Cormorant Garamond", Georgia, serif;
        font-size: 1.5rem;
        letter-spacing: 0.02em;
        text-align: center;
        line-height: 1.2;
      }
      .pl-name small {
        display: block;
        margin-top: 6px;
        font-family: "DM Sans", sans-serif;
        font-size: 0.62rem;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: #f3aab4;
      }
      /* Opening intro (home, once per session — see main.ts): the emblem pops,
         the cross draws, the name rises, then the curtain lifts upwards. */
      #preloader.pl-intro {
        animation: plCurtain 0.8s cubic-bezier(0.76, 0, 0.24, 1) 1.05s forwards;
      }
      #preloader.pl-intro .pl-spinner {
        display: none;
      }
      #preloader.pl-intro .pl-emblem {
        width: 72px;
        height: 72px;
        animation: plPop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      }
      #preloader.pl-intro .pl-cross {
        fill-opacity: 0;
        stroke-dasharray: 1;
        stroke-dashoffset: 1;
        animation: plDraw 0.55s ease-out 0.25s forwards;
      }
      #preloader.pl-intro .pl-name {
        display: block;
        animation: plRise 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.45s both;
      }
      @keyframes plPop {
        from {
          transform: scale(0.4);
          opacity: 0;
        }
      }
      @keyframes plDraw {
        70% {
          stroke-dashoffset: 0;
          fill-opacity: 0;
        }
        to {
          stroke-dashoffset: 0;
          fill-opacity: 1;
        }
      }
      @keyframes plRise {
        from {
          transform: translateY(18px);
          opacity: 0;
        }
      }
      @keyframes plCurtain {
        to {
          clip-path: inset(0 0 100% 0);
        }
      }
    </style>
  </head>
  <body>
    <div id="preloader">
      <svg class="pl-emblem" viewBox="0 0 64 64" aria-hidden="true">
        <defs>
          <linearGradient id="pl-g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#c8102e" />
            <stop offset="1" stop-color="#e0475a" />
          </linearGradient>
        </defs>
        <circle cx="32" cy="32" r="32" fill="url(#pl-g)" />
        <path class="pl-cross" d="M27 16h10v11h11v10H37v11H27V37H16V27h11z" fill="#fff" stroke="#fff" stroke-width="2" stroke-linejoin="round" pathLength="1" />
      </svg>
      <div class="pl-name" aria-hidden="true">Clinique Médicale Saint Viateur<small>Cocody · Abidjan</small></div>
      <div class="pl-spinner"></div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
