# Production stack: database + API + website (nginx).
#   cp .env.example .env   # then fill in every value
#   docker compose up -d --build
# Only "web" is published; the database and the API stay on the internal
# network. Put HTTPS in front of WEB_PORT (see docs/DEPLOIEMENT.md).

services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-clinique_saint_viateur}
      MARIADB_USER: ${DB_USER:-clinique}
      MARIADB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD est requis}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD est requis}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DEBUG: "false"
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-clinique_saint_viateur}
      DB_USER: ${DB_USER:-clinique}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD est requis}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY est requis}
      SITE_URL: ${SITE_URL:?SITE_URL est requis}
      CORS_ORIGINS: '["${SITE_URL}"]'
      # Only used to create the first admin on an empty database.
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD est requis}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - uploads:/app/uploads
      - backups:/app/backups

  web:
    build:
      context: ./frontend
      args:
        VITE_SITE_URL: ${SITE_URL:?SITE_URL est requis}
        VITE_GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  db-data:
  uploads:
  backups:
